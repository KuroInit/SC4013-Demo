name: sc4013-capitalone-lab
services:
  victim:
    build:
      context: .
      dockerfile: Dockerfile.victim
    image: sc4013-victim:local
    environment:
      POLICY_MODE: ${POLICY_MODE:-vulnerable}
    volumes:
      - ./.certs:/certs:ro
    depends_on:
      mock-metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1/health',context=ssl._create_unverified_context(),timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 3s
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 60
    networks: [edge, backend]

  attacker-kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: sc4013-kali-attacker:local
    entrypoint: ["/usr/local/bin/ttyd", "-p", "7681", "-i", "0.0.0.0", "-W", "-S", "-C", "/certs/lab.crt", "-K", "/certs/lab.key", "-m", "1", "-w", "/home/attacker", "/bin/bash", "-l"]
    environment:
      AWS_PAGER: ""
    volumes:
      - ./.certs:/certs:ro
    depends_on:
      victim:
        condition: service_healthy
      mock-s3:
        condition: service_healthy
    healthcheck:
      # TTYD's root page is a terminal client; probe the socket without opening HTTP/WebSocket sessions.
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',7681),timeout=3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    read_only: true
    tmpfs:
      - "/tmp:size=24m,noexec,nosuid,nodev"
      - "/home/attacker/loot:size=16m,uid=1000,gid=1000,mode=0700"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    networks: [edge]

  mock-metadata:
    build:
      context: .
      dockerfile: Dockerfile.metadata
    image: sc4013-mock-metadata:local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health',timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 2s
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 40
    networks: [backend]

  mock-s3:
    build:
      context: .
      dockerfile: Dockerfile.s3
    image: sc4013-mock-s3:local
    volumes:
      - ./.certs:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1/health',context=ssl._create_unverified_context(),timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 2s
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 40
    networks: [edge, backend]

  ingress-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: sc4013-ingress-gateway:local
    ports:
      - "127.0.0.1:8443:8443"
      - "[::1]:8443:8443"
      - "127.0.0.1:7681:7681"
      - "[::1]:7681:7681"
    depends_on:
      victim:
        condition: service_healthy
      attacker-kali:
        condition: service_healthy
    healthcheck:
      # Keep the victim's HTTP probe, but avoid polling TTYD's terminal page as HTTP.
      test: ["CMD", "python", "-c", "import socket,ssl,urllib.request; c=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8443/health',context=c,timeout=2).read(); s=socket.create_connection(('127.0.0.1',7681),timeout=3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 80
    networks: [ingress, edge]

networks:
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  edge:
    internal: true
  backend:
    internal: true
